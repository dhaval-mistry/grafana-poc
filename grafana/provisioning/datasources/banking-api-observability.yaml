# Stable datasource UIDs preserve existing dashboard and Explore links.
apiVersion: 1
# Provisioning identifies existing sources by name. Recreate only these owned
# sources with the same UIDs when migrating their display names.
deleteDatasources:
  - name: Step16 Prometheus
    orgId: 1
  - name: Step16 Tempo
    orgId: 1
  - name: Step16 Loki
    orgId: 1
datasources:
  - name: Banking API | Observability | Prometheus
    uid: step16-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
  - name: Banking API | Observability | Tempo
    uid: step16-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: step16-loki
        customQuery: true
        query: '{service_name="synthetic-banking-api"} | trace_id = "$${__trace.traceId}"'
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
  - name: Banking API | Observability | Loki
    uid: step16-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # Match the structured metadata key, not the literal event-name body.
        - name: Trace ID
          matcherType: label
          matcherRegex: '^trace_id$'
          datasourceUid: step16-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
